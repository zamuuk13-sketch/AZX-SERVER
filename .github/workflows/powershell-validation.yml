name: AZX PowerShell validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @("$PWD/launcher/manager.ps1", "$PWD/launcher/server-manager.ps1", "$PWD/launcher/prepare-instance.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }
      - name: Validate default configuration
        shell: pwsh
        run: |
          Get-Content config/default.json -Raw | ConvertFrom-Json | Out-Null
